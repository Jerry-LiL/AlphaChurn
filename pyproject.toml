[project]
name = "alphachurn"
version = "0.1.0"
description = "Churn scoring with explanations, and DocuMind cited question answering."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["alphachurn", "documind", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["alphachurn", "documind"]
